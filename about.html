<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.title">Berk Anbaroğlu | About Me</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* CSS VARIABLES & RESET */
        :root {
            --base-color: #fdfaf5;
            --color-1: #f3eee4;
            --color-2: #e8e2d4;
            --text-color: #333333;
            --accent-color: #d4a373;
            --secondary-accent: #faedcd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--base-color);
            padding: 1em;
        }

        h1, h2, h3, .logo {
            font-family: 'Merriweather', serif;
        }

        /* NAVIGATION */
        nav {
            max-width: 1000px;
            margin: 2em auto;
            width: min(1000px, 100%);
        }

        nav ul {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 2em;
        }

        nav li:first-child {
            margin-right: auto;
            font-weight: bold;
            font-size: 1.2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
        }

        nav a:hover {
            text-decoration: underline;
        }

        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 0.5em;
        }

        .lang-button {
            border: 1px solid transparent;
            background: transparent;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2em 0.4em;
            border-radius: 0.4em;
            line-height: 1;
        }

        .lang-button[aria-pressed="true"] {
            border-color: var(--accent-color);
            background-color: var(--secondary-accent);
        }

        /* LAYOUT SECTIONS */
        header, section {
            max-width: 75em;
            margin: 2em auto;
            padding: 3em 2em;
            background-color: var(--color-1);
            border-radius: 1.5em;
        }

        section h2 {
            font-size: 2rem;
            margin-bottom: 1em;
        }

        section p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1em;
        }

        footer {
            max-width: 1000px;
            margin: 2em auto;
            padding: 2em;
            text-align: center;
        }

        footer a {
            margin: 0 1em;
            text-decoration: none;
            color: var(--text-color);
        }

        /* RESPONSIVENESS */
        @media (max-width: 988px) {
            .flex-container {
                text-align: center;
            }
        }

        @media (max-width: 640px) {
            nav ul { gap: 1em; }
            nav li:not(:first-child):not(:last-child) { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Berk Anbaroğlu</a></li>
            <li><a href="about.html" data-i18n="nav.about">About</a></li>
            <li><a href="publications.html" data-i18n="nav.research">Publications</a></li>
            <li><a href="courses.html" data-i18n="nav.teaching">Teaching</a></li>
            <li><a href="mailto:hello@example.com" data-i18n="nav.contact">Contact</a></li>
            <li>
                <div class="lang-switcher" aria-label="Language">
                    <button type="button" class="lang-button" data-lang="en" aria-pressed="false" title="English">🇬🇧</button>
                    <button type="button" class="lang-button" data-lang="tr" aria-pressed="false" title="Türkçe">🇹🇷</button>
                </div>
            </li>
        </ul>
    </nav>

    <section id="about-me">
        <h2 data-i18n="about.title">About Me</h2>
        <p data-i18n="about.text1">Content about your background, education, and experience goes here.</p>
        <p data-i18n="about.text2">You can add multiple paragraphs to describe your career journey and achievements.</p>
    </section>

    <footer>
        <a href="#" data-i18n="footer.instagram">Instagram</a>
        <a href="#" data-i18n="footer.linkedin">LinkedIn</a>
        <a href="mailto:hello@example.com" data-i18n="footer.contact">Contact Me</a>
        <p style="margin-top: 2em; opacity: 0.5;" data-i18n="footer.copyright">&copy; 2026 Academic Profile</p>
    </footer>

    <script>
        const supportedLanguages = ["en", "tr"];
        const defaultLanguage = "en";

        const translations = {
            en: {
                "page.title": "Berk Anbaroğlu | About Me",
                "nav.about": "About Me",
                "nav.research": "Publications",
                "nav.teaching": "Courses",
                "nav.contact": "Contact",
                "about.title": "About Me",
                "about.text1": "Content about your background, education, and experience goes here.",
                "about.text2": "You can add multiple paragraphs to describe your career journey and achievements.",
                "footer.instagram": "Instagram",
                "footer.linkedin": "LinkedIn",
                "footer.contact": "Contact Me",
                "footer.copyright": "© 2026 Academic Profile"
            },
            tr: {
                "page.title": "Berk Anbaroğlu | Hakkımda",
                "nav.about": "Hakkımda",
                "nav.research": "Yayınlar",
                "nav.teaching": "Dersler",
                "nav.contact": "İletişim",
                "about.title": "Hakkımda",
                "about.text1": "Geçmişiniz, eğitim ve deneyim hakkında içerik buraya gelir.",
                "about.text2": "Kariyer yolculuğunuzu ve başarılarınızı açıklamak için birden fazla paragraf ekleyebilirsiniz.",
                "footer.instagram": "Instagram",
                "footer.linkedin": "LinkedIn",
                "footer.contact": "Bana Ulaşın",
                "footer.copyright": "© 2026 Akademik Profil"
            }
        };

        const getLanguageFromQuery = () => {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get("lang");
            return lang && supportedLanguages.includes(lang) ? lang : null;
        };

        const getPreferredLanguage = () => {
            const queryLang = getLanguageFromQuery();
            if (queryLang) {
                return queryLang;
            }

            const storedLang = localStorage.getItem("preferredLanguage");
            if (storedLang && supportedLanguages.includes(storedLang)) {
                return storedLang;
            }

            const browserLang = navigator.language?.slice(0, 2);
            return supportedLanguages.includes(browserLang) ? browserLang : defaultLanguage;
        };

        const applyTranslations = (messages) => {
            document.querySelectorAll("[data-i18n]").forEach((element) => {
                const key = element.getAttribute("data-i18n");
                if (messages[key]) {
                    if (element.hasAttribute("data-i18n-attr")) {
                        const attrName = element.getAttribute("data-i18n-attr");
                        element.setAttribute(attrName, messages[key]);
                    } else {
                        element.textContent = messages[key];
                    }
                }
            });

            document.querySelectorAll("[data-i18n-html]").forEach((element) => {
                const key = element.getAttribute("data-i18n-html");
                if (messages[key]) {
                    element.innerHTML = messages[key];
                }
            });

            if (messages["page.title"]) {
                document.title = messages["page.title"];
            }
        };

        const setLanguage = (language) => {
            const lang = supportedLanguages.includes(language) ? language : defaultLanguage;
            document.documentElement.lang = lang;
            localStorage.setItem("preferredLanguage", lang);

            if (translations[lang]) {
                applyTranslations(translations[lang]);
            }
        };

        const initialLanguage = getPreferredLanguage();
        const langButtons = document.querySelectorAll(".lang-button");
        const updateLangButtons = (activeLang) => {
            langButtons.forEach((button) => {
                const isActive = button.dataset.lang === activeLang;
                button.setAttribute("aria-pressed", isActive ? "true" : "false");
            });
        };

        langButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const lang = button.dataset.lang;
                setLanguage(lang);
                updateLangButtons(lang);
                const params = new URLSearchParams(window.location.search);
                params.set("lang", lang);
                window.history.replaceState({}, "", `${window.location.pathname}?${params.toString()}`);
            });
        });

        updateLangButtons(initialLanguage);

        setLanguage(initialLanguage);
    </script>

</body>
</html>
